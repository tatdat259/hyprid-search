[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-search-finance"
version = "0.1.0"
description = "Financial Intelligence Hybrid Search Reference Implementation"
authors = [
    { name = "Developer", email = "developer@example.com" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "rich>=13.0.0",
    "numpy>=1.26.0",
    "qdrant-client>=1.14.0",
    "fastembed>=0.5.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "google-genai>=1.0.0,<2.0.0",
    "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/satyam671/financial-hybrid-search-qdrant"
Repository = "https://github.com/satyam671/financial-hybrid-search-qdrant"
Issues = "https://github.com/satyam671/financial-hybrid-search-qdrant/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
hybrid-search = "hybrid_search.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: marks tests requiring external services or full pipelines",
    "slow: marks slow-running benchmarks or embedding downloads",
]
